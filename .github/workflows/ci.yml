name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/jarvis_ci
      JWT_SECRET_KEY: ci-only-jwt-secret-key-with-at-least-32-bytes
      JWT_ALROGITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      GEMINI_API_KEY: ci-only-gemini-key
      TOKEN_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      REFRESH_TOKEN_HASH_KEY: ci-only-refresh-token-hash-key
      GOOGLE_CLIENT_ID: ci-only-google-client-id
      GOOGLE_CLIENT_SECRET: ci-only-google-client-secret
      GOOGLE_REDIRECT_URI: http://127.0.0.1:8000/external-auth/google/callback
      FRONTEND_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000","http://localhost:4173","http://127.0.0.1:4173","http://localhost:5173","http://127.0.0.1:5173"]'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Run backend tests
        run: python -m pytest -q -p no:cacheprovider

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web_app

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web_app/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build
